name: mesh
# Publishes every product's mesh policies after a merge to main: `bundle` renders products/*.yaml
# (not the example) and this job force-pushes the result, alone, to the `mesh-policies` branch.
# Flux in each data plane applies that branch (platform-foundation: GitRepository and Kustomization
# `product-mesh`), so a reviewed spec change reaches the clusters without anyone running kubectl,
# and GitHub never holds cluster credentials.
#
# It pushes with a deploy key only this workflow holds (secret MESH_DEPLOY_KEY; the repo's one
# deploy key with write access). The ruleset on mesh-policies blocks every other update, deletion
# and force push, with deploy keys as its only bypass, so what Flux applies always came from main.
# Without the secret it falls back to the workflow's token, which the ruleset then refuses.

on:
  push:
    branches: [main]
    paths: ["products/**", "src/**", "pyproject.toml", ".github/workflows/mesh.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # push to mesh-policies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Render
        run: python -m platform_security bundle products -o "$RUNNER_TEMP/mesh"
      - name: Publish to mesh-policies
        env:
          DEPLOY_KEY: ${{ secrets.MESH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/mesh
        run: |
          git init -q -b mesh-policies
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mesh policies from ${GITHUB_REPOSITORY}@${SOURCE}"
          if [ -n "$DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/mesh-deploy-key"
            ( umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key" )
            ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
              git push -f "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:mesh-policies
            rm -f "$key"
          else
            echo "::warning::MESH_DEPLOY_KEY isn't set: pushing with the workflow token, which the mesh-policies ruleset refuses once it exists"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              push -f "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:mesh-policies
          fi
          echo "Published $(grep -c '\.yaml$' kustomization.yaml || true) product(s) from ${SOURCE}" >> "$GITHUB_STEP_SUMMARY"
