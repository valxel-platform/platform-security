[project]
name = "platform-security"
version = "0.1.0"
description = "Keycloak realms and Istio ambient mesh policies for Vrixel products"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_security"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
